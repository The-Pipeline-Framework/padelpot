quarkus.devservices.enabled=false
quarkus.http.host=127.0.0.1
quarkus.http.port=8080
quarkus.http.test-port=0
quarkus.grpc.server.test-port=0
pipeline.defaults.retry-limit=0
pipeline.max-recursive-depth=10
pipeline.parallelism=SEQUENTIAL
pipeline.max-concurrency=4
pipeline.orchestrator.mode=QUEUE_ASYNC
pipeline.orchestrator.state-provider=memory
pipeline.orchestrator.dispatcher-provider=event
pipeline.orchestrator.dlq-provider=log
pipeline.orchestrator.idempotency-policy=CLIENT_KEY_REQUIRED
pipeline.orchestrator.max-retries=0
pipeline.orchestrator.strict-startup=true
pipeline.llm.langchain4j.ollama.request-timeout=PT90S
pipeline.llm.langchain4j.ollama.thinking=false
pipeline.llm.langchain4j.openai-compatible.request-timeout=PT60S
pipeline.llm.langchain4j.openai-compatible.client-implementation=blocking
quarkus.otel.enabled=true
quarkus.otel.sdk.disabled=false
quarkus.otel.traces.enabled=true
quarkus.otel.traces.sampler=always_on
quarkus.otel.metrics.enabled=false
quarkus.otel.logs.enabled=false
quarkus.otel.exporter.otlp.enabled=false
pipeline.telemetry.enabled=true
pipeline.telemetry.tracing.enabled=true
pipeline.telemetry.tracing.per-item=true
pipeline.telemetry.replay.enabled=true
pipeline.telemetry.replay.exporter=file
pipeline.telemetry.replay.file.path=output/tpf-replay
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:file:./output/runtime/padelpot;DB_CLOSE_ON_EXIT=FALSE
quarkus.hibernate-orm.schema-management.strategy=update
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:padelpot;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create
persistence.provider.class=org.pipelineframework.plugin.persistence.provider.VThreadPersistenceProvider
persistence.duplicate-key=IGNORE
%test.pipeline.telemetry.replay.enabled=false
pipeline.orchestrator.worker.allowed-payload-prefixes=dev.padelpot.,org.pipelineframework.
quarkus.grpc.server.host=127.0.0.1
